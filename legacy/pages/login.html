<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NotiPoliWeb — Iniciar sesión</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body>

  <!-- ==================== HEADER ==================== -->
  <header class="header">
    <div class="header__container">
      <a href="../index.html" class="header__logo">📰 NotiPoliWeb</a>

      <nav class="header__nav">
        <a href="../index.html" class="header__link">Inicio</a>
        <a href="noticias.html" class="header__link">Noticias</a>
        <a href="favoritos.html" class="header__link">Favoritos</a>
        <a href="contacto.html" class="header__link">Contacto</a>
        <a href="acerca-de.html" class="header__link">Acerca de</a>
      </nav>

      <div class="header__account" id="accountDropdown">
        <button class="header__account-btn" id="accountBtn">
          👤 <span id="accountLabel">Mi cuenta</span> ▼
        </button>
        <div class="header__account-menu" id="accountMenu"></div>
      </div>
    </div>
  </header>

  <!-- ==================== CONTENEDOR LOGIN ==================== -->
  <main class="auth">
    <div class="auth__card">

      <!-- Título -->
      <h1 class="auth__titulo">Mi cuenta</h1>
      <p class="auth__subtitulo">
        Accede o crea una cuenta para gestionar tus favoritos.
      </p>

      <!-- Tabs -->
      <div class="auth__tabs">
        <button class="auth__tab auth__tab--active" data-tab="login">Iniciar sesión</button>
        <button class="auth__tab" data-tab="registro" onclick="window.location.href='registro.html'">Registrarse</button>
      </div>

      <!-- Mensaje de error global -->
      <div class="alert alert--error" id="loginError" style="display:none;"></div>

      <!-- Formulario -->
      <form class="auth__form" id="loginForm" novalidate>

        <div class="form__group">
          <label for="correo" class="form__label">Correo electrónico *</label>
          <input type="email" id="correo" name="correo" class="form__input"
                 placeholder="ejemplo@correo.com" autocomplete="email">
          <span class="form__error" id="errorCorreo"></span>
        </div>

        <div class="form__group">
          <label for="password" class="form__label">Contraseña *</label>
          <div class="form__password-wrapper">
            <input type="password" id="password" name="password" class="form__input"
                   placeholder="Ingresa tu contraseña" autocomplete="current-password">
            <button type="button" class="form__toggle-password" id="togglePassword"
                    aria-label="Mostrar contraseña">👁</button>
          </div>
          <span class="form__error" id="errorPassword"></span>
        </div>

        <div class="auth__extras">
          <label class="auth__checkbox">
            <input type="checkbox" id="recordarme">
            <span>Recordarme</span>
          </label>
          <a href="#" class="auth__link">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="btn btn--primary btn--full" id="btnLogin">
          Iniciar sesión
        </button>

      </form>

      <!-- Enlace a registro -->
      <p class="auth__pie">
        ¿No tienes cuenta?
        <a href="registro.html" class="auth__link">Regístrate aquí</a>
      </p>

    </div>
  </main>

  <!-- ==================== FOOTER ==================== -->
  <footer class="footer">
    <div class="footer__container">
      <div class="footer__col">
        <p>© 2026 NotiPoliWeb. Todos los derechos reservados.</p>
      </div>
      <div class="footer__col">
        <p>contacto@notipoliweb.com</p>
      </div>
      <div class="footer__col">
        <a href="#">Facebook</a>
        <a href="#">Twitter</a>
        <a href="#">Instagram</a>
      </div>
    </div>
  </footer>

  <script src="../js/app.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
