<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NotiPoliWeb — Noticias</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body>

  <!-- ==================== HEADER ==================== -->
  <header class="header">
    <div class="header__container">
      <a href="../index.html" class="header__logo">📰 NotiPoliWeb</a>

      <nav class="header__nav">
        <a href="../index.html" class="header__link">Inicio</a>
        <a href="noticias.html" class="header__link header__link--active">Noticias</a>
        <a href="favoritos.html" class="header__link">Favoritos</a>
        <a href="contacto.html" class="header__link">Contacto</a>
        <a href="acerca-de.html" class="header__link">Acerca de</a>
      </nav>

      <div class="header__account" id="accountDropdown">
        <button class="header__account-btn" id="accountBtn">
          👤 <span id="accountLabel">Mi cuenta</span> ▼
        </button>
        <div class="header__account-menu" id="accountMenu"></div>
      </div>
    </div>
  </header>

  <!-- ==================== TÍTULO + FILTROS ==================== -->
  <section class="section">
    <h1 class="section__title">Todas las Noticias</h1>
    <p class="section__subtitle">Explora las experiencias publicadas por la comunidad.</p>

    <div class="filters" id="filters">
      <button class="filter filter--active" data-categoria="Todas">Todas</button>
      <button class="filter" data-categoria="Educación">Educativas</button>
      <button class="filter" data-categoria="Tecnología">Tecnológicas</button>
      <button class="filter" data-categoria="Turismo">Turísticas</button>
      <button class="filter" data-categoria="Comercial">Comerciales</button>
    </div>
  </section>

  <!-- ==================== GRID DE NOTICIAS ==================== -->
  <section class="section section--gray">
    <div class="cards cards--grid-4" id="noticiasGrid">
      <!-- Render dinámico desde noticias.json -->
    </div>
    <p class="empty-state" id="emptyState" style="display:none;">
      No hay noticias en esta categoría todavía.
    </p>
  </section>

  <!-- ==================== FOOTER ==================== -->
  <footer class="footer">
    <div class="footer__container">
      <div class="footer__col">
        <p>© 2026 NotiPoliWeb. Todos los derechos reservados.</p>
      </div>
      <div class="footer__col">
        <p>contacto@notipoliweb.com</p>
      </div>
      <div class="footer__col">
        <a href="#">Facebook</a>
        <a href="#">Twitter</a>
        <a href="#">Instagram</a>
      </div>
    </div>
  </footer>

  <script src="../js/app.js"></script>
  <script src="../js/noticias.js"></script>
  <script src="../js/listados.js"></script>
</body>
</html>
