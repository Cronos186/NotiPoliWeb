version: '3.8'

services:
  notipoliweb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notipoliweb
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

