name: CI Pipeline - NotiPoliWeb

on:
  push:
    branches: [ main, arquitectura-3-contenedores ]
  pull_request:
    branches: [ main, arquitectura-3-contenedores ]

jobs:
  # Job 1: Build de imágenes Docker
  build:
    name: Build imágenes Docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build stack completo
        run: docker compose build

  # Job 2: Test de integración (verificar estado saludable)
  integration-test:
    name: Test integración (Docker Healthcheck)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Crear .env desde .env.example
        run: cp .env.example .env

      - name: Levantar stack completo
        run: docker compose up -d

      - name: Esperar y verificar servicios (Healthy)
        run: |
          echo "Esperando a que los servicios estén healthy..."
          # Esperar hasta 60 segundos
          for i in {1..12}; do
            # Verificamos directamente el estado de salud de los servicios con formato simple
            STATUS=$(docker compose ps --format '{{.Health}}')
            echo "Estado actual: $STATUS"

            # Si no hay contenedores en estado "starting" y todos dicen "healthy"
            if [[ "$STATUS" != *"starting"* && "$STATUS" == *"healthy"* && ! "$STATUS" == *"unhealthy"* ]]; then
              echo "✅ Todos los servicios están healthy"
              exit 0
            fi
            echo "Esperando servicios... ($i/12)"
            sleep 5
          done
          echo "❌ Los servicios no alcanzaron estado healthy"
          docker compose ps
          docker compose logs --tail 20
          exit 1

      - name: Limpiar stack
        if: always()
        run: docker compose down -v
